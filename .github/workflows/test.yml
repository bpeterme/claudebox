name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck cbox.sh macos/screenshot.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats and zsh (completion tests)
        run: sudo apt-get install -y bats zsh
      - name: Run unit tests
        run: bats tests/unit.bats

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run integration tests
        run: bats tests/integration.bats
