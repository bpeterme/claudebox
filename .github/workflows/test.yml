name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck cbox.sh macos/screenshot.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats and zsh (completion tests)
        run: sudo apt-get install -y bats zsh
      - name: Run unit tests
        run: bats tests/unit.bats

  # The Homebrew `cbox` runs with #!/bin/bash, which on macOS is always the
  # system bash 3.2, next to the BSD userland. The Ubuntu jobs cannot catch
  # regressions there. Integration tests need Docker, which macOS runners lack.
  unit-macos:
    name: Unit tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats
        run: brew install bats-core
      # The runner image puts Homebrew's bash 5 first on PATH. Put the
      # system bash 3.2 there instead, as on users' Macs.
      - name: Use the system bash (3.2)
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
      - name: Show bash version
        run: bash --version | head -1
      - name: Run unit tests
        run: bats tests/unit.bats

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run integration tests
        run: bats tests/integration.bats
